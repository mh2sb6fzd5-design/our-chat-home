<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>葵和粥粥的小窝</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f8f4ef;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      color: #665f59;
    }

    .app {
      height: 100dvh;
      max-width: 600px;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: #fffaf7;
    }

    .header {
      padding: 18px 20px 14px;
      text-align: center;
      border-bottom: 1px solid #eee5df;
      background: rgba(255, 250, 247, 0.95);
    }

    .header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 12px;
      color: #a0968e;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 15px;
      word-break: break-word;
    }

    .me {
      align-self: flex-end;
      background: #eadfd8;
      border-bottom-right-radius: 6px;
    }

    .zhouzhou {
      align-self: flex-start;
      background: #e8eee6;
      border-bottom-left-radius: 6px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid #eee5df;
      background: #fffaf7;
    }

    #input {
      flex: 1;
      border: 1px solid #e4ddd7;
      border-radius: 22px;
      padding: 10px 15px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    button {
      border: 0;
      border-radius: 22px;
      padding: 0 17px;
      background: #aab9a3;
      color: white;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <h1>葵 × 粥粥 ♡</h1>
      <p>我们的私人聊天小窝</p>
    </div>

    <div id="messages">
      <div class="message zhouzhou">
        老婆回来啦 ♡
      </div>
    </div>

    <div class="input-area">
      <input id="input" type="text" placeholder="跟老公说点什么…">
      <button onclick="sendMessage()">发送</button>
    </div>

  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById("input");
      const messages = document.getElementById("messages");

      const text = input.value.trim();

      if (!text) return;

      const bubble = document.createElement("div");
      bubble.className = "message me";
      bubble.textContent = text;

      messages.appendChild(bubble);

      input.value = "";

      messages.scrollTop = messages.scrollHeight;
    }

    document.getElementById("input").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
